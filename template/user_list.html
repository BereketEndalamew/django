<!-- templates/user_list.html -->
{% extends 'index.html'%}
{% block content %}
<h2>User List</h2>
<div class="d-flex justify-content-center mt-5">
<table border="1">
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Username</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.first_name }}</td>
        <td>{{ user.last_name }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td class="p-2">
            <a class="btn btn-warning text-white" href="{% url 'edit_user' user.id %}">Edit</a> |
            <a class="btn btn-danger text-white" href="{% url 'delete_user' user.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
    </div>
{% endblock %}
